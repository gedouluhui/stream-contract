name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade build setuptools wheel
      - run: python -m pip install .
      - run: python scripts/verify.py
      - run: python -m streamcontract demo
      - run: python -m build --no-isolation
      - run: python -c "import glob,subprocess,sys; files=glob.glob('dist/*.tar.gz'); assert len(files)==1, files; sys.exit(subprocess.call([sys.executable,'scripts/check_sdist.py',files[0]]))"
