[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamcontract"
version = "0.1.0"
description = "Offline stream boundary tests against explicit semantic oracles"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "gedouluhui"}]
dependencies = []
keywords = ["sse", "streaming", "llm", "testing", "protocol"]

[project.scripts]
streamcontract = "streamcontract.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
